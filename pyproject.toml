[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stellar-data-exporter"
dynamic = ["version"]
description = "Web UI for exporting Stellar Cyber query results as CSV or JSON."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncssh>=2.18,<3",
  "boto3>=1.35,<2",
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.urls]
Repository = "https://github.com/xdr-labs/stellar-data-exporter"
Issues = "https://github.com/xdr-labs/stellar-data-exporter/issues"

[project.scripts]
stellar-data-exporter = "app.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["app"]
namespaces = false

[tool.setuptools.package-data]
app = ["static/*"]

[tool.setuptools.dynamic]
version = {attr = "app.__version__"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
