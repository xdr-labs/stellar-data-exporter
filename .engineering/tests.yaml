version: 1

setup_command: "python -m pip install --disable-pip-version-check 'uv==0.12.18' && uv sync --extra dev"

paths:
  "**":
    domains:
      - "core"

scenarios:
  - id: ADOPTED-STATIC-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Git whitespace validation
    level: static
    domains:
      - "core"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    invariants:
      - "committed candidate/base diff has no whitespace errors"
    release_gate: true
  - id: CORE-UNIT-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: unit
    name: Python unit tests
    level: unit
    domains:
      - "core"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "uv run --extra dev pytest -q"
    invariants:
      - "query time filters, record flattening, and adaptive slicing regressions pass"
      - "persistent export history survives process-memory loss without persisting credentials or raw queries"
      - "remote split-export checkpoints persist completed part hashes and resume skips only regenerated parts that exactly match saved checkpoints"
      - "stable document identities are deduplicated without source-hash fallback, and reject-overlap blocks only intersecting matching export pipelines while allowing adjacent ranges"
      - "scheduled export payloads remain encrypted at rest, use remote destinations only, persist across restart, and advance contiguous windows only after successful runs"
      - "production service binds Uvicorn to loopback only and deployment templates require TLS, authentication, API rate limiting, restrictive systemd sandboxing, and protected persistent state"
    release_gate: true
  - id: RELEASE-ARTIFACT-001
    cost: medium
    estimated_seconds: 12
    timeout_seconds: 120
    agent_default: true
    scope: packaging
    name: Release artifact completeness
    level: integration
    domains:
      - "core"
    triggers:
      - pr
      - release
    platforms:
      - "linux"
    command: "bash -lc 'set -euo pipefail; tmp=$(mktemp -d); trap \"rm -rf \\\"$tmp\\\"\" EXIT; mkdir -p \"$tmp/dist\"; uv build --out-dir \"$tmp/dist\" >\"$tmp/build.log\" 2>&1; cat \"$tmp/build.log\"; ! grep -q \"Package would be ignored\" \"$tmp/build.log\"; uv run python tools/verify_release_artifacts.py \"$tmp/dist\"'"
    invariants:
      - "source distribution contains operational deployment and Engineering System files"
      - "wheel contains the Web UI static assets and canonical project metadata"
      - "setuptools emits no ambiguous package-data warning"
    release_gate: true
