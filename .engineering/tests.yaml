version: 1

setup_command: "uv sync --extra dev"

paths:
  "**":
    domains:
      - "core"

scenarios:
  - id: ADOPTED-STATIC-001
    cost: cheap
    estimated_seconds: 2
    timeout_seconds: 30
    agent_default: true
    scope: static
    name: Git whitespace validation
    level: static
    domains:
      - "core"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "bash -lc 'if [ -n \"${ENGINEERING_BASE_REF:-}\" ]; then git diff --check \"${ENGINEERING_BASE_REF}...HEAD\"; elif git rev-parse --verify --quiet origin/main >/dev/null; then git diff --check origin/main...HEAD; elif git rev-parse --verify --quiet main >/dev/null; then git diff --check main...HEAD; elif git rev-parse --verify --quiet HEAD^ >/dev/null; then git diff --check HEAD^...HEAD; else git diff --check; fi'"
    invariants:
      - "committed candidate/base diff has no whitespace errors"
    release_gate: true
  - id: CORE-UNIT-001
    cost: cheap
    estimated_seconds: 5
    timeout_seconds: 60
    agent_default: true
    scope: unit
    name: Python unit tests
    level: unit
    domains:
      - "core"
    triggers:
      - pr
      - preflight
      - release
    platforms:
      - "linux"
    command: "uv run --extra dev pytest -q"
    invariants:
      - "query time filters, record flattening, and adaptive slicing regressions pass"
      - "persistent export history survives process-memory loss without persisting credentials or raw queries"
      - "remote split-export checkpoints persist completed part hashes and resume skips only regenerated parts that exactly match saved checkpoints"
    release_gate: true
