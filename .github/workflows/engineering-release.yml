name: Engineering Release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact candidate SHA to qualify
        required: true
        type: string
      phase:
        description: Release contract phase
        required: true
        default: qualify
        type: choice
        options:
          - qualify
          - post-release

permissions:
  contents: read

jobs:
  release-contract:
    uses: datarelay-labs/engineering-system/.github/workflows/release-contract.yml@c16edb8c2a86f194f21c5ba16e5f75673a15ba5c
    with:
      expected_sha: ${{ inputs.expected_sha }}
      phase: ${{ inputs.phase }}
      profile_path: .engineering/release.yaml
